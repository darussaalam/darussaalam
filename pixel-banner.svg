<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .pixel-title {
        font-family: 'Press Start 2P', monospace, 'Courier New';
        font-size: 26px;
        fill: #00ff66;
        letter-spacing: 2px;
      }
      .pixel-sub {
        font-family: 'Press Start 2P', monospace, 'Courier New';
        font-size: 11px;
        fill: #7ee787;
        letter-spacing: 1px;
      }
      .pixel-meta {
        font-family: 'Press Start 2P', monospace, 'Courier New';
        font-size: 9px;
        fill: #8b949e;
      }
      .pixel-accent {
        fill: #ff7b72;
      }
      .pixel-blue {
        fill: #58a6ff;
      }
      .pixel-gold {
        fill: #d29922;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="180" fill="#0d1117" rx="0"/>

  <!-- Retro Pixel Border -->
  <rect x="6" y="6" width="788" height="168" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="12" y="12" width="776" height="156" fill="none" stroke="#238636" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Corner Pixel Accents -->
  <rect x="12" y="12" width="8" height="8" fill="#00ff66"/>
  <rect x="780" y="12" width="8" height="8" fill="#00ff66"/>
  <rect x="12" y="160" width="8" height="8" fill="#00ff66"/>
  <rect x="780" y="160" width="8" height="8" fill="#00ff66"/>

  <!-- Pixel Sprite: Retro Game Controller / Terminal icon -->
  <g transform="translate(36, 42)">
    <!-- 8-bit Heart Sprite -->
    <rect x="0" y="8" width="8" height="16" fill="#ff7b72"/>
    <rect x="8" y="0" width="16" height="28" fill="#ff7b72"/>
    <rect x="24" y="8" width="8" height="24" fill="#ff7b72"/>
    <rect x="32" y="0" width="16" height="28" fill="#ff7b72"/>
    <rect x="48" y="8" width="8" height="16" fill="#ff7b72"/>
    <rect x="12" y="28" width="32" height="8" fill="#ff7b72"/>
    <rect x="20" y="36" width="16" height="8" fill="#ff7b72"/>
    <!-- Heart Highlight -->
    <rect x="12" y="4" width="8" height="8" fill="#ffa198"/>
  </g>

  <!-- Main Title -->
  <text x="110" y="65" class="pixel-title">XINN // DARUSSALAM</text>
  
  <!-- Subtitle -->
  <text x="112" y="98" class="pixel-sub">&gt; FRONTEND DEVELOPER &amp; AI ENTHUSIAST</text>

  <!-- Status Bar HUD -->
  <g transform="translate(112, 122)">
    <!-- HP / Coffee Bar -->
    <text x="0" y="14" class="pixel-meta">HP</text>
    <rect x="30" y="4" width="110" height="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="32" y="6" width="100" height="8" fill="#ff7b72"/>

    <!-- MP / Code Bar -->
    <text x="160" y="14" class="pixel-meta">MP</text>
    <rect x="190" y="4" width="110" height="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="192" y="6" width="94" height="8" fill="#58a6ff"/>

    <!-- EXP Bar -->
    <text x="320" y="14" class="pixel-meta">LVL</text>
    <rect x="355" y="4" width="60" height="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="362" y="13" class="pixel-meta" fill="#d29922">2026</text>

    <!-- Blinking Cursor -->
    <rect x="440" y="3" width="10" height="14" fill="#00ff66">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Retro Mode Badge on Right -->
  <g transform="translate(640, 40)">
    <rect x="0" y="0" width="120" height="28" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="18" class="pixel-meta" fill="#00ff66">READY 1P</text>
    <circle cx="102" cy="14" r="4" fill="#00ff66">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
